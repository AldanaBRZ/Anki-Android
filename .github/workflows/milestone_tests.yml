name: Milestone workflow tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/milestone.yml'
      - '.github/workflows/milestone_tests.yml'
      - '.github/tests/milestone.test.cjs'
  push:
    paths:
      - '.github/workflows/milestone.yml'
      - '.github/workflows/milestone_tests.yml'
      - '.github/tests/milestone.test.cjs'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test milestone assignment
        run: node --test .github/tests/milestone.test.cjs
