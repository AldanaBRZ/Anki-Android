name: ankiquest APK

on:
  push:
    branches: [ankiquest]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: "jetbrains"
          java-version: "21"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Assemble
        run: |
          echo "fatal_warnings=false" >> local.properties
          ./gradlew :AnkiDroid:assembleFullRelease -Duniversal-apk=true -PcustomSuffix=quest -PcustomName="AnkiDroid Quest"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ankidroid-quest
          path: AnkiDroid/build/outputs/apk/full/release/*universal*.apk
          if-no-files-found: error
